name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: sudo apt-get update -y && sudo apt-get install -y uuid-dev libtls-dev liburing-dev wrk python3-srp

      - name: Cache local
        id: cache-local
        uses: actions/cache@v4
        with:
          path: local/
          key: local-v3-${{ runner.os }}-${{ runner.arch }}

      - name: Build ChezScheme
        if: steps.cache-chez.outputs.cache-hit != 'true'
        run: ./venv $(pwd)/local/ make chezscheme

      - name: Build letloop
        run: ./venv $(pwd)/local/ make letloop

      - name: Run tests
        run: ./venv $(pwd)/local/ make check

      - name: Stress letloop
        run: ./venv $(pwd)/local/ make stress

      - name: Package release
        run: |
          cp $(pwd)/local/bin/letloop letloop-linux-${{ matrix.arch }}
          sha256sum letloop-linux-${{ matrix.arch }} > letloop-linux-${{ matrix.arch }}.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: letloop-linux-${{ matrix.arch }}
          path: |
            letloop-linux-${{ matrix.arch }}
            letloop-linux-${{ matrix.arch }}.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/letloop-linux-amd64
            artifacts/letloop-linux-amd64.sha256
          generate_release_notes: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
