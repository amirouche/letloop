name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update -y && sudo apt-get install -y uuid-dev libtls-dev liburing-dev

      - name: Cache local
        id: cache-local
        uses: actions/cache@v4
        with:
          path: local/
          key: local-v2-${{ runner.os }}-${{ runner.arch }}

      - name: Build ChezScheme
        if: steps.cache-chez.outputs.cache-hit != 'true'
        run: ./venv local/  make chezscheme

      - name: Build C dependencies
        if: steps.cache-local.outputs.cache-hit != 'true'
        run: ./venv local/ make opaque argon2 blake3
        
      - name: Build letloop
        run: ./venv local/  make letloop

      - name: Run tests
        run: ./venv local/  make check

      - name: Package release
        run: |
          cp local/bin/letloop letloop-linux-${{ matrix.arch }}
          sha256sum letloop-linux-${{ matrix.arch }} > letloop-linux-${{ matrix.arch }}.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: letloop-linux-${{ matrix.arch }}
          path: |
            letloop-linux-${{ matrix.arch }}
            letloop-linux-${{ matrix.arch }}.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/letloop-linux-amd64
            artifacts/letloop-linux-amd64.sha256
            artifacts/letloop-linux-aarch64
            artifacts/letloop-linux-aarch64.sha256
          generate_release_notes: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare artifacts for Docker
        run: cp artifacts/letloop-linux-aarch64 artifacts/letloop-linux-arm64

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest
