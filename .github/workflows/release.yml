name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y uuid-dev libncurses-dev

      - name: Build ChezScheme
        run: ./venv make chezscheme

      - name: Build binink
        run: ./venv make binink

      - name: Run tests
        run: ./venv make check

      - name: Package release
        run: |
          mkdir -p binink-linux-amd64
          cp local/bin/binink binink-linux-amd64/
          cp local/lib/*.boot binink-linux-amd64/ 2>/dev/null || true
          tar czf binink-linux-amd64.tar.gz binink-linux-amd64

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: binink-linux-amd64.tar.gz
          generate_release_notes: true
