name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y uuid-dev libncurses-dev

      - name: Cache ChezScheme
        id: cache-chez
        uses: actions/cache@v4
        with:
          path: local/
          key: chezscheme-v10.3.0-${{ runner.os }}-${{ runner.arch }}

      - name: Build ChezScheme
        if: steps.cache-chez.outputs.cache-hit != 'true'
        run: ./venv local/  make chezscheme

      - name: Build letloop
        run: ./venv local/  make letloop

      - name: Run tests
        run: ./venv local/  make check

      - name: Package release
        run: |
          mkdir -p letloop-linux-amd64
          cp local/bin/letloop letloop-linux-amd64/
          cp local/lib/*.boot letloop-linux-amd64/ 2>/dev/null || true
          tar czf letloop-linux-amd64.tar.gz letloop-linux-amd64

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: letloop-linux-amd64.tar.gz
          generate_release_notes: true
