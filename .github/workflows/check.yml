name: Check

on:
  push:
    branches: [hello-schemer, dev]
  pull_request:
    branches: [hello-schemer, dev]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y uuid-dev libncurses-dev libtls-dev libsodium23 libsodium-dev

      - name: Cache ChezScheme
        id: cache-chez
        uses: actions/cache@v4
        with:
          path: local/
          key: chezscheme-v10.3.0-${{ runner.os }}-${{ runner.arch }}

      - name: Build ChezScheme
        if: steps.cache-chez.outputs.cache-hit != 'true'
        run: ./venv local/ make chezscheme

      - name: Build letloop
        run: ./venv local/ make letloop

      - name: Run tests
        run: ./venv local/ make check
