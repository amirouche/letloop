name: Check

on:
  push:
    branches: [hello-schemer, dev]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y uuid-dev libncurses-dev

      - name: Build ChezScheme
        run: ./venv make chezscheme

      - name: Build letloop
        run: ./venv make letloop

      - name: Run tests
        run: ./venv make check
